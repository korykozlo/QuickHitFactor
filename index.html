<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QuickHitFactor</title>
<meta name="description" content="The hit factor, hits and time it takes to make each class on every active USPSA classifier.">
<link rel="canonical" href="https://quickhitfactor.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="QuickHitFactor">
<meta property="og:title" content="QuickHitFactor">
<meta property="og:description" content="The hit factor, hits and time it takes to make each class on every active USPSA classifier.">
<meta property="og:url" content="https://quickhitfactor.com/">
<meta property="og:image" content="https://quickhitfactor.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="QuickHitFactor: what it takes to make each class on every USPSA classifier">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="QuickHitFactor">
<meta name="twitter:description" content="The hit factor, hits and time it takes to make each class on every active USPSA classifier.">
<meta name="twitter:image" content="https://quickhitfactor.com/og-image.png">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: classifier rail on the left, stage sheet on the right; stacks to one column on phones. */
:root {
  --bg: #eef0f2;          /* range-day slate paper */
  --panel: #ffffff;
  --ink: #1b2229;
  --muted: #5b6672;
  --line: #d5dae0;
  --tan: #b98a4e;         /* cardboard target */
  --tan-soft: #f3e7d6;
  --steel: #2f5d84;       /* popper steel */
  --steel-soft: #dfe9f2;
  --miss: #b23a2e;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12171c; --panel: #1a2128; --ink: #e6eaee; --muted: #9aa5b1; --line: #2c3640;
    --tan: #d4a566; --tan-soft: #3a2f22; --steel: #7fb0da; --steel-soft: #1f3142; --miss: #e0786c;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171c; --panel: #1a2128; --ink: #e6eaee; --muted: #9aa5b1; --line: #2c3640;
  --tan: #d4a566; --tan-soft: #3a2f22; --steel: #7fb0da; --steel-soft: #1f3142; --miss: #e0786c;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font-body); }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }

.app { display: grid; grid-template-columns: minmax(260px, 320px) minmax(0, 1fr); gap: 24px;
  max-width: 1280px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 40px; }
header.brand { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
header.brand h1 { font: 700 2rem/1 var(--font-display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
header.brand h1 span { color: var(--tan); }
header.brand p { margin: 0; color: var(--muted); }

/* Classifier rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); align-self: start;
  max-height: calc(100vh - 24px); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.rail input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
.rail ul { list-style: none; margin: 0; padding: 0; overflow-y: auto; border: 1px solid var(--line);
  border-radius: 6px; background: var(--panel); }
.rail li button { width: 100%; display: grid; grid-template-columns: 4.2em 1fr auto; gap: 8px; align-items: baseline;
  padding: 8px 12px; border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left; cursor: pointer; }
.rail li:last-child button { border-bottom: 0; }
.rail li button:hover { background: var(--bg); }
.rail li button[aria-current="true"] { background: var(--tan-soft); }
.rail .code { font: 500 .9rem var(--font-num); color: var(--muted); }
.rail .tag { font-size: .7rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* Stage sheet */
main { min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.sheet-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font: 700 2.4rem/1 var(--font-display); text-wrap: balance; }
.sheet-head h2 .code { color: var(--tan); margin-right: .3em; }
.facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0; padding: 0; list-style: none; }
.facts li { font-size: .85rem; padding: 2px 10px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); }
.facts li.steel { background: var(--steel-soft); border-color: transparent; }
.sheet-head a { color: var(--steel); font-weight: 600; }

.grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
figure { margin: 0; background: #fff; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
figure img { display: block; width: 100%; height: auto; }
figure figcaption { padding: 6px 10px; font-size: .78rem; color: #5b6672; background: #fff; border-top: 1px solid #d5dae0; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.label { font: 600 .75rem var(--font-body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); cursor: pointer;
  font: 600 1rem var(--font-display); letter-spacing: .03em; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); }
.seg button:disabled { cursor: not-allowed; opacity: .45; }
.pf .note { margin-top: 6px; }
.note { font-size: .9rem; color: var(--muted); margin: 0; }
.hhf-line { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.hhf-line strong { font: 500 1.4rem var(--font-num); }
.hhf-line input { width: 8em; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); font-family: var(--font-num); }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th, td { padding: 6px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font: 600 .75rem var(--font-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
th:first-child, td:first-child { text-align: left; }
td { font-family: var(--font-num); font-size: .95rem; }
.classes tbody tr { cursor: pointer; }
.classes tbody tr:hover { background: var(--bg); }
.classes tbody tr[aria-selected="true"] { background: var(--tan-soft); }
.classes td:first-child { font: 700 1.2rem var(--font-display); }
.scroll { overflow-x: auto; }

.combos { display: flex; flex-direction: column; gap: 10px; }
.combos-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.combos-head h3 { margin: 0; font: 700 1.5rem var(--font-display); }
.combos-head select { padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); }
.combo-table { max-height: 520px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.combo-table thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
.combo-table td.m { color: var(--miss); }
.combo-table td.time { font-weight: 500; }
.zero { color: var(--muted); opacity: .55; }
.empty { padding: 24px; text-align: center; color: var(--muted); }

/* Member lookup */
.member input { width: 12em; max-width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px;
  background: var(--bg); font-family: var(--font-num); text-transform: uppercase; }
.member input::placeholder { text-transform: none; }
.member .note { margin-top: 6px; font-size: .85rem; }
.member .note a, .combos .note a { color: var(--steel); }
.classes tr.target td { background: var(--steel-soft); }
.classes tr.target td:first-child { font-size: 1rem; }


@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; }
  .rail ul { max-height: 260px; }
  .grid { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="brand">
    <h1>Quick<span>Hit</span>Factor</h1>
    <p>What it takes to make each class on every active USPSA classifier.</p>
  </header>

  <nav class="rail" aria-label="Classifiers">
    <input id="search" type="search" placeholder="Search number or name" aria-label="Search classifiers">
    <ul id="list"></ul>
  </nav>

  <main id="main">
    <p class="empty">Loading classifiers…</p>
  </main>

</div>

<script src="calc.js"></script>
<script>
(function () {
  const $ = (s, el = document) => el.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
  const state = { data: null, code: null, division: "carry-optics", pf: "minor", cls: "A", misses: "0", customHHF: {}, member: "" };

  // Revalidate on every load so a data update shows up without waiting out the browser cache.
  fetch("data/classifiers.json", { cache: "no-cache" }).then((r) => r.json()).then((data) => {
    state.data = data;
    const fromHash = location.hash.slice(1);
    state.code = data.classifiers.some((c) => c.code === fromHash) ? fromHash : "99-11";
    renderList();
    render();
  }).catch(() => {
    $("#main").innerHTML = `<p class="empty">Couldn't load the classifier data. Reload the page to try again.</p>`;
  });

  $("#search").addEventListener("input", renderList);
  window.addEventListener("hashchange", () => {
    const c = location.hash.slice(1);
    if (state.data && c !== state.code && state.data.classifiers.some((x) => x.code === c)) { state.code = c; renderList(); render(); }
  });

  function sortKey(code) { // 99-xx series is the oldest, so it sorts first
    const [y, n] = code.split("-").map(Number);
    return (y === 99 ? -1 : y) * 100 + n;
  }

  function renderList() {
    const q = $("#search").value.trim().toLowerCase();
    const items = state.data.classifiers
      .filter((c) => !q || c.code.includes(q) || c.name.toLowerCase().includes(q))
      .sort((a, b) => sortKey(a.code) - sortKey(b.code));
    $("#list").innerHTML = items.length ? items.map((c) => `
      <li><button type="button" data-code="${c.code}" aria-current="${c.code === state.code}">
        <span class="code">${c.code}</span><span>${esc(c.name)}</span>
        <span class="tag">${c.hhfEstimate ? "est. HHF" : !Object.keys(c.hhf).length ? "no HHF" : ""}</span>
      </button></li>`).join("") : `<li class="empty">No classifier matches “${esc(q)}”.</li>`;
    $("#list").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      state.code = b.dataset.code;
      history.replaceState(null, "", "#" + state.code);
      renderList(); render();
      if (window.matchMedia("(max-width: 900px)").matches) $("#main").scrollIntoView();
    }));
  }

  function current() { return state.data.classifiers.find((c) => c.code === state.code); }
  function division() { return state.data.divisions.find((d) => d.id === state.division); }
  function hhf(c) { return c.hhf[state.division] ?? state.customHHF[c.code + "/" + state.division] ?? null; }
  function pf() { return division().major ? state.pf : "minor"; }

  function render() {
    const c = current();
    const div = division();
    const paper = c.rounds - c.steel;
    $("#main").innerHTML = `
      <div class="sheet-head">
        <div>
          <h2><span class="code">${c.code}</span>${esc(c.name)}</h2>
          <ul class="facts">
            <li>${c.scoring === "Virginia" ? "Virginia Count" : "Comstock"}</li>
            <li>${c.rounds} scoring hits · ${c.points} points</li>
            ${c.steel ? `<li class="steel">${c.steel} steel · ${paper} paper hits</li>` : ""}
          </ul>
        </div>
        <a href="${esc(c.pdf)}" target="_blank" rel="noopener">Full stage sheet (PDF)</a>
      </div>
      <div class="grid">
        <figure>
          <a href="${esc(c.diagram)}" target="_blank" rel="noopener"><img src="${esc(c.diagram)}" alt="Stage diagram for ${c.code} ${esc(c.name)}" width="935" height="1210"></a>
          <figcaption>Stage sheet © USPSA · tap to enlarge</figcaption>
        </figure>
        <div class="panel">
          <div class="member">
            <label class="label" for="member-input">USPSA member number</label>
            <div class="hhf-line"><input id="member-input" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false"
              placeholder="e.g. A123456" value="${esc(state.member)}"></div>
            <p class="note" id="member-note" aria-live="polite"></p>
          </div>
          <div>
            <div class="label">Division</div>
            <div class="seg" id="divs">${state.data.divisions.map((d) =>
              `<button type="button" data-div="${d.id}" aria-pressed="${d.id === state.division}" title="${esc(d.name)}">${esc(d.short || d.name)}</button>`).join("")}</div>
          </div>
          <div class="pf">
            <div class="label">Power factor</div>
            <div class="seg" id="pfs">
              <button type="button" data-pf="minor" aria-pressed="${pf() === "minor"}" ${div.major ? "" : "disabled"}>Minor</button>
              <button type="button" data-pf="major" aria-pressed="${pf() === "major"}" ${div.major ? "" : "disabled"}>Major</button>
            </div>
            ${div.major ? "" : `<p class="note">${esc(div.name)} scores Minor only.</p>`}
          </div>
          ${hhfBlock(c, div)}
          <div id="classes"></div>
        </div>
      </div>
      <section class="combos panel" id="combos"></section>`;

    $("#divs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
      state.division = b.dataset.div; render();
      if (state.member) refreshMember();
    }));
    $("#pfs").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.pf = b.dataset.pf; render(); }));
    const hin = $("#hhf-input");
    if (hin) hin.addEventListener("input", () => {
      const v = parseFloat(hin.value);
      const key = c.code + "/" + state.division;
      if (v > 0) state.customHHF[key] = v; else delete state.customHHF[key];
      renderTables();
    });
    showMember();
    let typing;
    $("#member-input").addEventListener("input", (e) => {
      clearTimeout(typing);
      typing = setTimeout(() => setMember(e.target.value), 400);
    });
    $("#member-input").addEventListener("change", (e) => { clearTimeout(typing); setMember(e.target.value); });
    renderTables();
  }

  // Member lookup. uspsa.org can't be read from another site's page (bot challenge, no CORS),
  // so scores come from hitfactor.info's open API, which mirrors PractiScore classifier uploads.
  const HF_DIV = { open: "opn", limited: "ltd", "limited-10": "l10", "limited-optics": "lo", "carry-optics": "co",
    production: "prod", "single-stack": "ss", revolver: "rev", pcc: "pcc" };
  const lookups = new Map();

  function fetchMember(num, div) {
    const key = num + "/" + div;
    if (!lookups.has(key)) {
      const url = `https://www.hitfactor.info/api/shooters/${HF_DIV[div]}/${encodeURIComponent(num)}`;
      const p = fetch(url).then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); });
      p.catch(() => lookups.delete(key)); // let a failed lookup be retried
      lookups.set(key, p);
    }
    return lookups.get(key);
  }

  const found = (j) => !!(j && j.info && j.info.memberNumber && j.info.memberNumber !== "N/A");

  // Classifier percentages in this division, newest first. Scored against this app's HHFs where it
  // has one (so 26-series count), otherwise the percentage hitfactor.info recorded.
  function memberPercents(j, div) {
    return (j.classifiers || [])
      .filter((s) => s.source === "Stage Score" && s.hf > 0)
      .sort((a, b) => (a.sd < b.sd ? 1 : a.sd > b.sd ? -1 : 0))
      .map((s) => {
        const h = state.data.classifiers.find((c) => c.code === s.classifier)?.hhf[div];
        return h ? (100 * s.hf) / h : s.percent;
      })
      .filter((p) => p > 0);
  }

  // What the member needs: { status: "loading" | "error" | "notfound" | "unclassed" | "gm" | "target", ... }
  let memberInfo = null;
  let lookupSeq = 0;

  function setMember(raw) {
    const num = raw.trim().replace(/\s+/g, "").toUpperCase();
    if (num === state.member && memberInfo && memberInfo.status !== "error") return;
    state.member = num;
    if (!num && state.cls === "member") state.cls = "A";
    refreshMember();
  }

  function refreshMember() {
    const num = state.member;
    const div = state.division;
    const seq = ++lookupSeq;
    if (!num) { memberInfo = null; showMember(); renderTables(); return; }
    memberInfo = { status: "loading" };
    showMember();
    fetchMember(num, div).then((j) => {
      if (found(j)) return j;
      // No scores in this division; check the rest to tell "unclassed here" from "not found".
      const others = Object.keys(HF_DIV).filter((d) => d !== div);
      return Promise.all(others.map((d) => fetchMember(num, d).catch(() => null)))
        .then((all) => (all.some(found) ? { info: { memberNumber: num }, classifiers: [] } : null));
    }).then((j) => {
      if (seq !== lookupSeq) return;
      memberInfo = j ? summarize(j, num, div) : { status: "notfound" };
      if (memberInfo.status === "target" && state.cls !== "member") state.cls = "member";
      if (memberInfo.status !== "target" && state.cls === "member") state.cls = "A";
      showMember(); renderTables();
    }).catch(() => {
      if (seq !== lookupSeq) return;
      memberInfo = { status: "error" };
      if (state.cls === "member") state.cls = "A";
      showMember(); renderTables();
    });
  }

  function summarize(j, num, div) {
    const percents = memberPercents(j, div);
    const base = { num, div, name: j.info.name, count: percents.length,
      link: `https://www.hitfactor.info/shooters/${HF_DIV[div]}/${encodeURIComponent(num)}` };
    if (percents.length < 5) return { ...base, status: "unclassed" };
    const avg = percents.length >= 6 ? QHF.classAverage(percents) : percents.reduce((t, p) => t + p, 0) / 5;
    let cls = QHF.classFor(avg);
    // USPSA never moves a member down a class, so keep the class USPSA has on record if it's higher.
    const rank = (id) => QHF.CLASSES.findIndex(([k]) => k === id);
    const hq = j.info.hqClass;
    if (percents.length >= 6 && rank(hq) >= 0 && rank(hq) < rank(cls)) cls = hq;
    const next = QHF.nextClass(cls);
    if (!next) return { ...base, status: "gm", avg, cls };
    return { ...base, status: "target", avg, cls, unclassed: percents.length < 6, next,
      percent: QHF.neededPercent(percents, next.min) };
  }

  function showMember() {
    const note = $("#member-note");
    if (!note) return;
    const m = memberInfo;
    const who = m && m.name ? `${esc(m.name)} · ` : "";
    const src = m && m.link && m.count ? ` <a href="${m.link}" target="_blank" rel="noopener">Scores from hitfactor.info</a>.` : "";
    note.innerHTML = !m ? ""
      : m.status === "loading" ? "Looking up member…"
      : m.status === "error" ? "Couldn't reach hitfactor.info. Try again in a moment."
      : m.status === "notfound" ? "Member not found."
      : m.status === "unclassed" ? `Member is unclassed.${m.count ? ` ${who}${m.count} classifier score${m.count === 1 ? "" : "s"} in ${esc(division().name)}.` : ""}${src}`
      : m.status === "gm" ? `${who}GM in ${esc(division().name)} (${m.avg.toFixed(2)}%). There's no class above GM.${src}`
      : m.unclassed ? `${who}Unclassed in ${esc(division().name)} with 5 scores (average ${m.avg.toFixed(2)}%). The 6th sets the class.${src}`
      : `${who}${m.cls} in ${esc(division().name)} (best 6 of last 8: ${m.avg.toFixed(2)}%).${src}`;
  }

  function hhfBlock(c, div) {
    if (c.hhf[state.division] != null) {
      return `<div><div class="label">High hit factor · ${esc(div.name)}</div>
        <div class="hhf-line"><strong>${c.hhf[state.division].toFixed(4)}</strong></div>
        ${c.hhfFromClassMins ? `<p class="note">Worked out from the published minimum hit factor for each class (GM is 95% of the HHF).</p>`
          : c.hhfEstimate ? `<p class="note">This classifier has no official HHF yet, so this is the recommended HHF that <a href="${esc(c.hhfSource)}" target="_blank" rel="noopener">hitfactor.info</a> estimates from scores so far. Treat it as a guide.</p>`
          : state.division === "limited-10" && !c.hhfSource ? `<p class="note">USPSA's HHF tables have no Limited-10 column, so this is the current HHF from <a href="https://www.hitfactor.info/classifiers/l10/${c.code}" target="_blank" rel="noopener">hitfactor.info</a>.</p>`
          : c.hhfSource ? `<p class="note">USPSA's HHF tables don't cover this classifier yet, so this is the current HHF from <a href="${esc(c.hhfSource)}" target="_blank" rel="noopener">hitfactor.info</a>.</p>` : ""}</div>`;
    }
    const saved = state.customHHF[c.code + "/" + state.division] ?? "";
    const why = "This classifier's high hit factors aren't in USPSA's published HHF tables yet.";
    return `<div><div class="label">High hit factor · ${esc(div.name)}</div>
      <p class="note">${why} Enter one to run the numbers.</p>
      <div class="hhf-line"><input id="hhf-input" type="number" step="0.0001" min="0" inputmode="decimal" placeholder="e.g. 9.5000" value="${saved}" aria-label="High hit factor"></div></div>`;
  }

  function renderTables() {
    const c = current();
    const h = hhf(c);
    if (!h) {
      $("#classes").innerHTML = "";
      $("#combos").innerHTML = `<p class="empty">Class targets appear here once there's a high hit factor.</p>`;
      return;
    }
    const best = c.points;
    const t = memberTarget(h);
    if (!t && state.cls === "member") state.cls = "A";
    const targetRow = !t ? "" : `<tr class="target" data-cls="member" aria-selected="${state.cls === "member"}"><td>${esc(state.member)} → ${t.cls}</td>
      <td>${t.percent.toFixed(2)}%</td><td>${t.hf ? t.hf.toFixed(4) : "any"}</td><td>${t.hf ? QHF.maxTime(best, t.hf).toFixed(2) + "s" : "–"}</td></tr>`;
    $("#classes").innerHTML = `<div class="scroll"><table class="classes">
      <thead><tr><th>Class</th><th>Score</th><th>Min HF</th><th>Time at all A</th></tr></thead>
      <tbody>${targetRow}${state.data.classes.map((k) => {
        const next = state.data.classes[state.data.classes.indexOf(k) - 1];
        if (k.min === 0) {
          return `<tr data-cls="D" aria-selected="${state.cls === "D"}"><td>D</td><td>under ${next.min}%</td><td>–</td><td>–</td></tr>`;
        }
        const mhf = QHF.minHitFactor(h, k.min);
        const t = QHF.maxTime(best, mhf);
        return `<tr data-cls="${k.id}" aria-selected="${state.cls === k.id}"><td>${k.id}</td>
          <td>${k.min}%</td><td>${mhf.toFixed(4)}</td><td>${t.toFixed(2)}s</td></tr>`;
      }).join("")}</tbody></table></div>
      <p class="note">${t ? `The first row is what ${esc(state.member)} needs on ${c.code} to make ${t.cls}. ` : ""}Pick a class to see every hit combination that makes it.</p>`;
    $("#classes").querySelectorAll("tbody tr").forEach((tr) => tr.addEventListener("click", () => {
      state.cls = tr.dataset.cls; renderTables();
      $("#combos").scrollIntoView({ block: "nearest" });
    }));
    renderCombos(c, h);
  }

  // The member's needed hit factor on this classifier, or null when there's no target to show.
  function memberTarget(h) {
    const m = memberInfo;
    if (!m || m.status !== "target" || m.num !== state.member || m.div !== state.division || m.percent == null) return null;
    return { cls: m.next.id, percent: m.percent, hf: QHF.minHitFactor(h, m.percent) };
  }

  function renderCombos(c, h) {
    const t = state.cls === "member" ? memberTarget(h) : null;
    const k = t ? { id: t.cls, min: t.percent, member: true } : state.data.classes.find((x) => x.id === state.cls);
    const box = $("#combos");
    if (t && !t.hf) {
      box.innerHTML = `<div class="combos-head"><h3>${t.cls} for ${esc(state.member)}</h3></div>
        <p class="note">Any score on ${c.code} makes ${t.cls}: the oldest of the last 8 scores drops out and that's enough on its own.</p>`;
      return;
    }
    if (k.min === 0) {
      box.innerHTML = `<div class="combos-head"><h3>D class</h3></div>
        <p class="note">Any score below ${state.data.classes.at(-2).min}% of the high hit factor lands in D, so there's no time to beat.</p>`;
      return;
    }
    const mhf = QHF.minHitFactor(h, k.min);
    const all = QHF.combinations(c.rounds, c.steel, pf());
    const rows = all.filter((r) => state.misses === "all" || r.m <= Number(state.misses));
    const v = QHF.POINTS[pf()];
    const cell = (n, cls = "") => `<td class="${n ? cls : "zero"}">${n}</td>`;
    box.innerHTML = `
      <div class="combos-head">
        <h3>${k.id}${k.member ? ` for ${esc(state.member)}` : ""} on ${c.code} · ${esc(division().name)}${division().major ? ` ${pf() === "major" ? "Major" : "Minor"}` : ""}</h3>
        <label class="note">Misses
          <select id="misses">
            ${["0", "1", "2", "3", "all"].map((m) => `<option value="${m}" ${state.misses === m ? "selected" : ""}>${m === "all" ? "Any number" : m === "0" ? "None" : "Up to " + m}</option>`).join("")}
          </select>
        </label>
      </div>
      <p class="note">Hit factor ${mhf.toFixed(4)} or better${k.member ? ` (${k.min.toFixed(2)}% of the HHF)` : ""}. A = ${v.A}, C = ${v.C}, D = ${v.D}, miss = −10.
        ${c.steel ? `${c.steel} of the ${c.rounds} hits are steel, which score as an A or a miss.` : ""}
        Times are the slowest that still make ${k.id}. No-shoots and procedurals aren't counted.</p>
      <div class="combo-table"><table>
        <thead><tr><th>A</th><th>C</th><th>D</th><th>Miss</th><th>Points</th><th>Max time</th></tr></thead>
        <tbody>${rows.map((r) => `<tr>${cell(r.a)}${cell(r.c)}${cell(r.d)}${cell(r.m, "m")}
          <td>${r.points}</td><td class="time">${QHF.maxTime(r.points, mhf).toFixed(2)}s</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="note">${rows.length.toLocaleString()} of ${all.length.toLocaleString()} combinations shown.</p>`;
    $("#misses").addEventListener("change", (e) => { state.misses = e.target.value; renderCombos(c, h); });
  }
})();
</script>
</body>
</html>
